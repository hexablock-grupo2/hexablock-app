name: Bug report
description: Something does not behave as expected
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (include game variant and seed if relevant)
    validations:
      required: true
