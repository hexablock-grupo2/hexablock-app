name: Task / feature
description: A unit of work for the backlog
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist or work when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions (ideally they become tests).
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Main layer
      options:
        - Entities / Domain
        - Use Cases / Application
        - Interface Adapters
        - Frameworks & Infrastructure
        - Docs / Tooling
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / related ADRs or specs
